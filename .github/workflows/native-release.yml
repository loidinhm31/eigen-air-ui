name: Native Desktop Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-tauri:
    name: Build Desktop App (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            config_overlay: src-tauri/tauri.linux.conf.json
          - platform: macos-arm64
            os: macos-14
            target: aarch64-apple-darwin
            config_overlay: src-tauri/tauri.macos.conf.json
          - platform: macos-x86_64
            os: macos-14
            target: x86_64-apple-darwin
            config_overlay: src-tauri/tauri.macos.conf.json
          - platform: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            config_overlay: src-tauri/tauri.windows.conf.json

    steps:
      - name: Checkout UI repository
        uses: actions/checkout@v4

      - name: Checkout Backend runtime repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/eigen-air
          path: eigen-air

      - name: Setup Node & PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 9.1.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and stage companion binary and manifest from backend
        run: |
          cd eigen-air
          if [ "${{ runner.os }}" = "Windows" ]; then
            powershell ./scripts/package-companion.ps1 -Target ${{ matrix.target }} -Features cpu
          else
            bash ./scripts/package-companion.sh --target ${{ matrix.target }} --features cpu
          fi
          cd ..
          mkdir -p apps/native/src-tauri/binaries
          if [ -f "eigen-air/artifacts/staging/${{ matrix.target }}/bin/eigen-air-companion" ]; then
            cp "eigen-air/artifacts/staging/${{ matrix.target }}/bin/eigen-air-companion" "apps/native/src-tauri/binaries/eigen-air-companion-${{ matrix.target }}"
          elif [ -f "eigen-air/artifacts/staging/${{ matrix.target }}/bin/eigen-air-companion.exe" ]; then
            cp "eigen-air/artifacts/staging/${{ matrix.target }}/bin/eigen-air-companion.exe" "apps/native/src-tauri/binaries/eigen-air-companion-${{ matrix.target }}.exe"
          fi
          if [ -f "eigen-air/artifacts/staging/${{ matrix.target }}/manifest.json" ]; then
            cp "eigen-air/artifacts/staging/${{ matrix.target }}/manifest.json" "apps/native/src-tauri/binaries/manifest.json"
          fi

      - name: Build Tauri desktop application
        run: |
          pnpm --filter @eigen-air-ui/native tauri build --target ${{ matrix.target }} --config ${{ matrix.config_overlay }}

      - name: Upload bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-bundle-${{ matrix.platform }}
          path: apps/native/src-tauri/target/**/bundle/
          retention-days: 14
